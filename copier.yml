_min_copier_version: '9.18.2'
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
# No tasks, migrations, extensions, or secret questions: generation never runs code.
_exclude:
    - copier.yml
    - .git
    - '**/* 2'
    - '**/* 2.*'
    - 'node_modules'
    - '.pnpm-store'
    - '.env'
    - '.env.*'
    - '!.env.example'
    - '!.env.*.example'
    - '*.local'
    - '*.secret'
    - '*.key'
    - '*.pem'
    - 'logs'
    - '*.log'
    - 'npm-debug.log*'
    - 'yarn-debug.log*'
    - 'yarn-error.log*'
    - 'pnpm-debug.log*'
    - '*.out'
    - '*.tsbuildinfo'
    - 'dist'
    - 'dist-bundle'
    - 'dist-test'
    - 'build'
    - 'out'
    - 'release'
    - 'debug'
    - '.tmp'
    - '.temp'
    - '.next'
    - '.turbo'
    - 'coverage'
    - '.cache'
    - '.eslintcache'
    - '.stylelintcache'
    - '*.cache'
    - '*.pid'
    - '*.seed'
    - '*.pid.lock'
    - 'package-lock.json'
    - 'yarn.lock'
    - 'drizzle/meta/_journal.local.json'
    - 'docker-compose.override.yml'
    - '.agents'
    - '.codex'
    - 'skills-lock.json'
    - '.idea'
    - '.vscode/*'
    - '!.vscode/extensions.json'
    - '!.vscode/settings.json'
    - '*.sublime-project'
    - '*.sublime-workspace'
    - '.DS_Store'
    - 'Thumbs.db'
    - 'desktop.ini'
    - '*.swp'
    - '*.swo'
    - '*~'
    - '*.tmp'
    - '*.zip'
    - '*.tar'
    - '*.gz'
    - '*.rar'
    - '*.7z'
    - '*.sqlite'
    - '*.sqlite3'
    - '*.db'
    - '*.bak'
    - '*.old'
    - '*.orig'
    - '*.rej'
    - 'backups'
    - 'statsd'
    - '*.dump'
    - 'test-results'
    - 'playwright-report'
    - '.cache'
    - '**/out-native'
    - 'frontend/universal/.generated'
    - 'desktop/.generated'
    - 'desktop/renderer'
    - 'desktop/out'
    - 'desktop/dist'

project_slug:
    type: str
    help: Project identifier (3–32 lowercase letters, numbers, or hyphens)
    default: my-app
    validator: >-
        {% if not (project_slug | regex_search('^[a-z][a-z0-9-]{2,31}$')) %}
        Use 3–32 lowercase letters, numbers, or hyphens, starting with a letter.
        {% endif %}
project_name:
    type: str
    help: Public application name (not a secret)
    default: My App
    validator: >-
        {% if not (project_name | regex_search('^[^\x00-\x1f]{1,80}$')) or '"' in project_name or '\\' in project_name %}
        Use 1–80 characters without control characters, double quotes, or backslashes.
        {% endif %}
_message_after_copy: |
    Project created. Run git init, then ./start.sh (requires Docker, tmux, and pnpm).
    It creates .env and opens System Stats pairing in your browser.
    Review .env and commit .copier-answers.yml and project.json; never commit .env.
_message_after_update: |
    Review git diff and resolve any conflict markers before testing.
    Run pnpm install --frozen-lockfile and pnpm verify.
    Existing .env files are preserved; review .env.example for new settings.
