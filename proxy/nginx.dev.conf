resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream frontend {
  zone frontend 64k;
  server frontend:3000 resolve;
}

upstream backend {
  zone backend 64k;
  server backend:4000 resolve;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  client_max_body_size 5M;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws: wss: https:; frame-src 'self' blob: https://challenges.cloudflare.com https://js.stripe.com https://checkout.stripe.com" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  proxy_hide_header X-Powered-By;

  proxy_http_version 1.1;
  proxy_read_timeout 3600;
  proxy_send_timeout 3600;

  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Port $server_port;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location / {
    proxy_pass http://frontend;
  }

  # The calendar download belongs to Next.js, while other APIs use the backend.
  location = /api/calendar-import {
    client_max_body_size 4k;
    proxy_pass http://frontend;
  }

  location = /api {
    return 301 /api/;
  }

  # Multipart event attachments have a separate limit from JSON requests.
  location ^~ /api/calendar-files/events/ {
    client_max_body_size 21M;
    proxy_pass http://backend;
  }

  location ^~ /api/ {
    proxy_pass http://backend;
  }
}

server {
  listen 8081;
  # Only published port 80 accepts direct traffic. 8081 is internal to the tunnel.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;
  server_name _;
  server_tokens off;

  client_max_body_size 5M;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws: wss: https:; frame-src 'self' blob: https://challenges.cloudflare.com https://js.stripe.com https://checkout.stripe.com" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  proxy_hide_header X-Powered-By;

  proxy_http_version 1.1;
  proxy_read_timeout 3600;
  proxy_send_timeout 3600;

  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Port $server_port;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location / {
    proxy_pass http://frontend;
  }

  # The calendar download belongs to Next.js, while other APIs use the backend.
  location = /api/calendar-import {
    client_max_body_size 4k;
    proxy_pass http://frontend;
  }

  location = /api {
    return 301 /api/;
  }

  # Multipart event attachments have a separate limit from JSON requests.
  location ^~ /api/calendar-files/events/ {
    client_max_body_size 21M;
    proxy_pass http://backend;
  }

  location ^~ /api/ {
    proxy_pass http://backend;
  }
}
