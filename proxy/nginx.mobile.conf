# Dedicated native endpoint: no web workspace is exposed on this listener.
server {
  listen 8082;
  server_name _;
  server_tokens off;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;
  client_max_body_size 5M;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  proxy_hide_header X-Powered-By;
  # This document embeds Turnstile; it does not use the web workspace's WASM.
  proxy_hide_header Cross-Origin-Embedder-Policy;
  proxy_hide_header Cross-Origin-Opener-Policy;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $http_host;

  location / { return 404; }
  location = /captcha/triton { proxy_pass http://frontend; }
  location = /api/calendar-import {
    client_max_body_size 4k;
    proxy_pass http://frontend;
  }
  location ^~ /api/calendar-files/events/ {
    client_max_body_size 21M;
    proxy_pass http://backend;
  }
  location ^~ /api/ { proxy_pass http://backend; }
}
