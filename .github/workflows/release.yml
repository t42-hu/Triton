name: Build release images
on:
    workflow_dispatch:
    push:
        tags: ['v*']
permissions:
    contents: read
jobs:
    verify:
        uses: ./.github/workflows/ci.yml
    images:
        needs: verify
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                app: [backend, frontend]
        steps:
            - uses: actions/checkout@v4
            - name: Validate public release configuration
              env:
                  APP_ID: ${{ vars.APP_ID }}
                  APP_URL: ${{ vars.APP_URL }}
              run: |
                  node --input-type=module -e 'import { cloneIdentity } from "./infrastructure/config.mjs"; if (!process.env.APP_ID || !process.env.APP_URL) throw new Error("Set repository APP_ID and APP_URL variables before building release images"); cloneIdentity(process.cwd(), process.env.APP_ID); const url = new URL(process.env.APP_URL); if (url.protocol !== "https:" || url.origin !== process.env.APP_URL) throw new Error("APP_URL must be an HTTPS origin");'
            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Resolve image name
              id: image
              env:
                  REPOSITORY: ${{ github.repository }}
                  APP: ${{ matrix.app }}
              run: echo "name=ghcr.io/${REPOSITORY,,}-${APP}" >> "$GITHUB_OUTPUT"
            - uses: docker/build-push-action@v6
              id: build
              with:
                  context: .
                  file: ${{ matrix.app }}/Dockerfile.prod
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
                  provenance: mode=max
                  sbom: true
                  build-args: |
                      NEXT_PUBLIC_APP_ID=${{ vars.APP_ID }}
                      NEXT_PUBLIC_APP_NAME=${{ vars.APP_NAME || 'Fullstack Starter' }}
                      NEXT_PUBLIC_APP_URL=${{ vars.APP_URL || 'http://localhost:8080' }}
                      NEXT_PUBLIC_APP_DOMAIN=${{ vars.APP_DOMAIN }}
                      NEXT_PUBLIC_APP_DESCRIPTION=${{ vars.APP_DESCRIPTION }}
                      NEXT_PUBLIC_API_URL=/api
                      NEXT_PUBLIC_AUTH_URL=/api/auth
                      NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
            - name: Record immutable release reference
              env:
                  IMAGE: ${{ steps.image.outputs.name }}
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
